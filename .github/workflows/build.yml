name: Build Cross-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # Configure retention settings - reduced to save storage
  ARTIFACT_RETENTION_DAYS: 7  # Keep artifacts for only 7 days (they're attached to releases anyway)
  MAX_RELEASES_TO_KEEP: 3  # Keep only last 3 releases

jobs:
  # Clean up old artifacts first
  cleanup-artifacts:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Delete old artifacts
      uses: actions/github-script@v6
      with:
        script: |
          const { data: artifacts } = await github.rest.actions.listArtifactsForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          
          const now = Date.now();
          const retentionDays = 1; // Delete artifacts older than 1 day (they're attached to releases anyway)
          const retentionMs = retentionDays * 24 * 60 * 60 * 1000;
          
          let deletedCount = 0;
          let totalSize = 0;
          
          for (const artifact of artifacts.artifacts) {
            const createdAt = new Date(artifact.created_at).getTime();
            const age = now - createdAt;
            totalSize += artifact.size_in_bytes || 0;
            
            // Delete artifacts older than retention period OR if we have too many artifacts
            if (age > retentionMs || artifacts.artifacts.length > 10) {
              console.log(`Deleting artifact: ${artifact.name} (${Math.round(age / (24 * 60 * 60 * 1000))} days old, ${(artifact.size_in_bytes / 1024 / 1024).toFixed(2)} MB)`);
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
                deletedCount++;
              } catch (error) {
                console.log(`Failed to delete artifact ${artifact.name}: ${error.message}`);
              }
            }
          }
          
          console.log(`\n📊 Artifact cleanup summary:`);
          console.log(`   Total artifacts: ${artifacts.artifacts.length}`);
          console.log(`   Deleted: ${deletedCount}`);
          console.log(`   Remaining: ${artifacts.artifacts.length - deletedCount}`);
          console.log(`   Total size: ${(totalSize / 1024 / 1024).toFixed(2)} MB`);
  
  # Clean up old releases
  cleanup:
    needs: [cleanup-artifacts]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - name: Delete old releases
      uses: actions/github-script@v6
      with:
        script: |
          const maxReleases = parseInt(process.env.MAX_RELEASES_TO_KEEP);
          const { data: releases } = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          
          // Filter out drafts and prereleases, sort by creation date
          const stableReleases = releases
            .filter(release => !release.draft && !release.prerelease)
            .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
          
          if (stableReleases.length > maxReleases) {
            const releasesToDelete = stableReleases.slice(maxReleases);
            
            for (const release of releasesToDelete) {
              console.log(`Deleting old release: ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id
              });
              
              // Also delete the git tag
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`
                });
              } catch (error) {
                console.log(`Could not delete tag ${release.tag_name}: ${error.message}`);
              }
            }
          }

  build:
    needs: [cleanup-artifacts, cleanup]
    if: always() && (needs.cleanup.result == 'success' || needs.cleanup.result == 'skipped')
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: "*.exe"
          - os: macos-latest
            platform: macos
            artifact: "*.dmg"
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        
    - name: Install macOS-specific dependencies
      if: matrix.os == 'macos-latest'
      run: |
        pip install dmgbuild ds_store mac_alias
    
    - name: Install NSIS (Windows only)
      if: matrix.os == 'windows-latest'
      run: |
        choco install nsis
    
    - name: Build application
      run: |
        python build_cross_platform.py
    
    - name: Upload artifacts
      if: startsWith(github.ref, 'refs/tags/')  # Only upload artifacts on tag pushes
      continue-on-error: true  # Don't fail if quota is exceeded
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform }}-build
        path: |
          Bignan_Mancha_OMR_Reader_*_Setup.exe
          Bignan_Mancha_OMR_Reader_*.dmg
          Bignan_Mancha_OMR_Reader_*.zip
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
        compression-level: 9  # Maximum compression to reduce size
    
    - name: List build outputs (for release job)
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        echo "Build outputs available:"
        find . -name "Bignan_Mancha_OMR_Reader_*" -type f | head -10
        echo "::notice::Build files are ready for release attachment"

  # Create release after all builds complete
  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      continue-on-error: true  # Don't fail if artifacts don't exist (quota exceeded)
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true
        
    - name: List downloaded files
      continue-on-error: true
      run: |
        echo "Files in current directory:"
        ls -la
        echo "Looking for Bignan Mancha OMR Reader installers:"
        if find . -name "Bignan_Mancha_OMR_Reader_*" 2>/dev/null | head -10; then
          echo "✅ Artifacts found and ready for release"
        else
          echo "⚠️ No artifacts found (may be due to storage quota)"
          echo "Release will be created without attached files"
        fi
        
    - name: Check for release files
      id: check_files
      continue-on-error: true
      run: |
        if find . -name "Bignan_Mancha_OMR_Reader_*" -type f 2>/dev/null | grep -q .; then
          echo "files_exist=true" >> $GITHUB_OUTPUT
          echo "✅ Release files found"
        else
          echo "files_exist=false" >> $GITHUB_OUTPUT
          echo "⚠️ No release files found (artifact storage quota may be exceeded)"
        fi
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: Bignan Mancha OMR Reader ${{ github.ref_name }}
        body: |
          ## 🚀 Bignan Mancha OMR Reader ${{ github.ref_name }}
          
          ### 📥 Downloads:
          - **Windows**: `Bignan_Mancha_OMR_Reader_*_Setup.exe` - Full installer with shortcuts (includes Poppler)
          - **macOS**: `Bignan_Mancha_OMR_Reader_*.dmg` - Drag to Applications folder
          
          ### ✨ Features:
          - **OMR Sheet Processing** - Process and analyze OMR (Optical Mark Recognition) sheets
          - **PDF Extraction** - Extract pages from PDF files (built-in Poppler support on Windows)
          - **Image Analysis** - Detailed statistics and metadata viewing
          - **Batch Processing** - Process multiple sheets efficiently
          - **Export Results** - Export analysis results in various formats
          
          ### 🛠️ System Requirements:
          - **Windows**: Windows 10 or later (Poppler bundled - no additional installation needed)
          - **macOS**: macOS 10.14 or later (requires `brew install poppler`)
          
          ### 📝 What's New in v2.0:
          - Application rebranded to "Bignan Mancha OMR Reader"
          - **Automatic Poppler bundling for Windows** - PDF extraction works out-of-the-box
          - Enhanced error handling and user messages
          - Improved cross-platform compatibility
          
          ---
          
          **Note**: Only the latest ${{ env.MAX_RELEASES_TO_KEEP }} releases are kept to manage storage.
          
          ⚠️ **If release files are missing**: This may be due to GitHub Actions artifact storage quota limits. Check the Actions tab for build outputs or manually attach files to this release.
          
        files: |
          **/Bignan_Mancha_OMR_Reader_*_Setup.exe
          **/Bignan_Mancha_OMR_Reader_*.dmg
          **/Bignan_Mancha_OMR_Reader_*.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
